name: Windows (Direct3D12)

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile
      shell: cmd
      run: |
        cd paint
        call ..\base\make.bat --compile

    - name: Check the output exists
      shell: pwsh
      run: |
        if (-not (Test-Path paint/build/out/ArmorPaint.exe)) { throw "ArmorPaint.exe was not produced" }
        Get-ChildItem paint/build/out | Format-Table Name, Length

    - name: Package
      shell: pwsh
      run: Compress-Archive -Path paint/build/out/* -DestinationPath ArmorPaint_win64.zip

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-win64
        path: ArmorPaint_win64.zip
        if-no-files-found: error
